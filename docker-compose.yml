version: "3.8"

# ============================================================
# MnVision 360 — Docker Compose
# Services: postgres, backend, frontend, nginx,
#           minio, mlflow, pgadmin
# ============================================================

networks:
  mnvision-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  mlflow_data:
    driver: local
  pgadmin_data:
    driver: local

services:
  # ----------------------------------------------------------
  # PostgreSQL 15 + PostGIS 3.4
  # ----------------------------------------------------------
  postgres:
    image: postgis/postgis:15-3.4
    container_name: mnvision_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mnvision360}
      POSTGRES_USER: ${POSTGRES_USER:-mnvision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mnvision360}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed/seed_data_sources.sql:/docker-entrypoint-initdb.d/02_seed_data_sources.sql:ro
      - ./database/seed/seed_prototype.sql:/docker-entrypoint-initdb.d/03_seed_prototype.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mnvision} -d ${POSTGRES_DB:-mnvision360}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # FastAPI Backend
  # ----------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mnvision_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mnvision}:${POSTGRES_PASSWORD:-mnvision360}@postgres:5432/${POSTGRES_DB:-mnvision360}
      MINIO_ENDPOINT: minio:9000
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      mlflow:
        condition: service_started
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # React + MapLibre GL JS Frontend
  # ----------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_MAPLIBRE_STYLE: ${VITE_MAPLIBRE_STYLE:-https://demotiles.maplibre.org/style.json}
    container_name: mnvision_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # Nginx Reverse Proxy
  # ----------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: mnvision_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # MinIO Object Storage (S3-compatible)
  # ----------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: mnvision_minio
    restart: unless-stopped
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-mnvision_access}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-mnvision_secret_key}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # MinIO Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # MLflow Experiment Tracking
  # ----------------------------------------------------------
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.1
    container_name: mnvision_mlflow
    restart: unless-stopped
    command: >
      mlflow server
        --host 0.0.0.0
        --port 5000
        --backend-store-uri sqlite:///mlflow/mlflow.db
        --default-artifact-root /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - mnvision-network

  # ----------------------------------------------------------
  # PgAdmin 4 (Database Administration UI)
  # ----------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mnvision_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@mnvision.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin360}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - mnvision-network
