# ============================================================
# MnVision 360 — Nginx Reverse Proxy Configuration
# ============================================================

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ----------------------------------------------------------
    # Logging format
    # ----------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    # ----------------------------------------------------------
    # Performance
    # ----------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 100M;   # Allow large GIS file uploads

    # ----------------------------------------------------------
    # Gzip Compression
    # ----------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/geo+json
        application/vnd.mapbox-vector-tile
        image/svg+xml
        font/truetype
        font/opentype
        application/vnd.ms-fontobject;

    # ----------------------------------------------------------
    # Security Headers
    # ----------------------------------------------------------
    add_header X-Frame-Options           "SAMEORIGIN"   always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header X-Content-Type-Options    "nosniff"      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
    server_tokens off;

    # ----------------------------------------------------------
    # WebSocket upgrade map (for future real-time features)
    # ----------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ----------------------------------------------------------
    # Upstreams
    # ----------------------------------------------------------
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:80;
        keepalive 16;
    }

    # ----------------------------------------------------------
    # Main Server Block
    # ----------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Timeouts
        proxy_connect_timeout    60s;
        proxy_send_timeout       120s;
        proxy_read_timeout       120s;

        # Proxy common headers
        proxy_set_header Host               $host;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_http_version 1.1;

        # -------------------------------------------------------
        # API → FastAPI Backend
        # -------------------------------------------------------
        location /api/ {
            proxy_pass http://backend/api/;

            # WebSocket support (for future WS endpoints)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Disable caching for API responses
            add_header Cache-Control "no-store, no-cache, must-revalidate" always;
            add_header Pragma "no-cache" always;

            # Pass CORS headers from backend
            proxy_pass_header Access-Control-Allow-Origin;
            proxy_pass_header Access-Control-Allow-Methods;
            proxy_pass_header Access-Control-Allow-Headers;
        }

        # -------------------------------------------------------
        # Health check → Backend
        # -------------------------------------------------------
        location /health {
            proxy_pass http://backend/health;
            access_log off;
            add_header Cache-Control "no-store" always;
        }

        # -------------------------------------------------------
        # OpenAPI docs (passthrough to backend)
        # -------------------------------------------------------
        location /docs {
            proxy_pass http://backend/docs;
        }

        location /redoc {
            proxy_pass http://backend/redoc;
        }

        location /openapi.json {
            proxy_pass http://backend/openapi.json;
        }

        # -------------------------------------------------------
        # Static GeoJSON / tile data (if served directly)
        # -------------------------------------------------------
        location /static/ {
            proxy_pass http://backend/static/;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }

        # -------------------------------------------------------
        # React SPA Frontend (catch-all)
        # -------------------------------------------------------
        location / {
            proxy_pass http://frontend/;

            # WebSocket passthrough (for Vite HMR in dev if needed)
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            # Cache HTML with revalidation; assets are content-hashed
            add_header Cache-Control "no-cache";
        }

        # -------------------------------------------------------
        # SPA fallback — serve index.html for client-side routing
        # -------------------------------------------------------
        location @frontend_fallback {
            proxy_pass http://frontend/;
        }

        # -------------------------------------------------------
        # Error pages
        # -------------------------------------------------------
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
}
